
name: CI-CD ELECTROTECH

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  calidad-y-pruebas:
    name: Calidad, Vitest y Build
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar TypeScript
        run: npm run lint

      - name: Ejecutar pruebas unitarias
        run: npm test

      - name: Generar cobertura de pruebas
        run: npm run test:coverage

      - name: Compilar proyecto
        run: npm run build

      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-vitest
          path: coverage/
          if-no-files-found: ignore
